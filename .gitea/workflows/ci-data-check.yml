name: ci-data-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # pip 默认打 pypi.org：本机实测 index 0.28s(清华) vs 1.09s(官方)，
  # 而 protocol-algorithm 的 task 1135 因为直连官方索引卡了 42 分钟才被人顶掉。
  # 超时也一起收紧：pip 默认 5 次重试 x 15 秒会叠加成几十分钟静默等待。
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  PIP_DEFAULT_TIMEOUT: "15"
  PIP_RETRIES: "2"

jobs:
  data-consistency:
    name: data/*.yml vs README.md + schema
    # 只有 NAS runner 配了 github_mirror；落到 1.4G 的 Pi 上连 action 都拉不下来（实测 task 1074 7s 即败）
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'amd64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Validate data/*.yml against JSON Schema
        run: |
          python -c "
          import json, yaml, sys
          import jsonschema
          schemas = {
              'data/projects.yml': 'assets/schema/projects.schema.json',
              'data/tech_stack.yml': 'assets/schema/tech_stack.schema.json',
          }
          ok = True
          for yml, schema_path in schemas.items():
              with open(schema_path, encoding='utf-8') as sf:
                  schema = json.load(sf)
              with open(yml, encoding='utf-8') as df:
                  data = yaml.safe_load(df)
              try:
                  jsonschema.validate(data, schema)
                  print(f'OK  {yml} conforms to {schema_path}')
              except jsonschema.ValidationError as e:
                  print(f'FAIL {yml}: {e.message}')
                  ok = False
          sys.exit(0 if ok else 1)
          "
      - name: Cross-check data vs README
        run: python scripts/check_data_consistency.py
